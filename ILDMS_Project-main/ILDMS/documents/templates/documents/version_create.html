{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3><i class="bi bi-plus-circle me-2"></i>Create New Version</h3>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="{{ form.file.id_for_label }}" class="form-label">New Version File*</label>
                    {{ form.file }}
                    <div class="form-text">Upload the updated version of the document</div>
                    <div class="invalid-feedback">
                        Please select a file for the new version.
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="{{ form.changes.id_for_label }}" class="form-label">Changes Description*</label>
                    {{ form.changes }}
                    <div class="form-text">Describe what changes were made in this version</div>
                </div>
                
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-primary me-md-2">
                        <i class="bi bi-save me-1"></i> Create Version
                    </button>
                        <a href="{% url 'documents:document_detail' document.pk %}" class="btn btn-outline-secondary">

                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Client-side validation
(function () {
    'use strict'
    const forms = document.querySelectorAll('.needs-validation')
    Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
        }, false)
    })
})()
</script>
{% endblock %}
