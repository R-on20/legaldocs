{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-danger text-white">
            <h3><i class="bi bi-exclamation-triangle"></i> Permanent Deletion</h3>
        </div>
        <div class="card-body">
            <div class="alert alert-danger">
                <h4 class="alert-heading">Warning!</h4>
                <p>You are about to permanently delete this document. This action cannot be undone.</p>
                <hr>
                <p class="mb-0">Document: <strong>{{ object.title }}</strong></p>
                <p>Archived on: {{ object.archived_at|date:"SHORT_DATETIME_FORMAT" }}</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'documents:archived_documents' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Delete Permanently
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
